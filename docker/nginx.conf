# nginx.conf — testimonies.world containerized deploy.
#
# Mirrors scripts/nginx/rtv-cases (the live deploy's nginx
# config) so the two surfaces are interchangeable. Routes:
#   /static/   → backend (whitenoise-served)
#   /media/    → backend (Django auth-gated download)
#   /public-media/ → served off disk (no auth; profile photos)
#   /api/      → backend
#   /admin/    → backend
#   /accounts/ → backend (allauth)
#   /events/   → backend (taiga-events)
#   /healthz   → backend (internal — NOT proxied publicly)
#   /          → frontend
#
# Public HTTPS is terminated upstream (Cloudflare/Caddy on the
# hypervisor). The loopback here is plain HTTP; Django trusts
# X-Forwarded-Proto via SECURE_PROXY_SSL_HEADER.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 25m;
    proxy_read_timeout 60s;
    proxy_buffering off;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ---- Security headers (M6, 2026-09-18) -----------------------------
    # `always` so headers are emitted on 4xx/5xx responses too.
    # HSTS duplicated here vs Django's SECURE_HSTS_SECONDS — harmless
    # (browsers take the longest max-age); belt-and-braces so a future
    # Django refactor can't silently regress HSTS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    # X-XSS-Protection is deprecated; MDN/OWASP recommend explicitly
    # DISABLING it — old UAs used it to introduce XSS via the filter
    # bypass.
    add_header X-XSS-Protection           "0" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;

    # CSP — conservative starter. You WILL need to widen this in prod:
    #   * SvelteKit injects inline <style> blocks → 'unsafe-inline' for
    #     style-src. The production fix is a nonce (Django 5.0+
    #     SECURE_CSP_NONCE_HMAC or SvelteKit's CSP plugin); the inline
    #     gap is a known follow-up.
    #   * Allauth Google OAuth popup → allow accounts.google.com in
    #     frame-src and form-action.
    #   * Person profile images load from arbitrary https: origins via
    #     the public-media path — allow https: in img-src.
    # Verify with: curl -sI https://<host>/ | grep -i security
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; form-action 'self' https://accounts.google.com; base-uri 'self'; object-src 'none'" always;

    # Upstreams — service names resolve via compose DNS.
    upstream backend  { server backend:8040;  keepalive 16; }
    upstream frontend { server frontend:3000; keepalive 16; }

    # Forwarded headers — trusted because nginx is the only
    # hop in front of gunicorn in this topology.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ---- Backend-routed paths ----
    location /static/   { proxy_pass http://backend; }
    # /media/ is auth-gated by Django (serve_protected_media in
    # cases/views.py) — the old direct-from-disk alias was
    # removed in commit `b9c1bf0` because it let unauthenticated
    # users grab sensitive evidence files.
    location /media/    { proxy_pass http://backend; }
    # /public-media/ is the other half of the media split: files that
    # are public by definition (Person.profile_image). Served straight
    # off the shared volume with no auth, because these render on the
    # anonymous /persons catalog. Mirrors the `location /public-media/`
    # block in scripts/nginx/rtv-cases; keep the two in step.
    location /public-media/ {
        alias /app/public_media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        # Repeat security headers — nginx drops parent add_header
        # when a child block declares its own.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "DENY" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header X-XSS-Protection           "0" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; form-action 'self' https://accounts.google.com; base-uri 'self'; object-src 'none'" always;
        autoindex off;
        try_files $uri =404;
    }
    location /api/      { proxy_pass http://backend; }
    location /admin/    { proxy_pass http://backend; }
    location /accounts/ { proxy_pass http://backend; }
    location /events/   { proxy_pass http://backend; }

    # /healthz — internal-only liveness probe. The upstream
    # nginx is in the same compose network, so it can reach
    # `backend:8040/healthz` directly. Do NOT expose this
    # path publicly — it would leak DB/cache error details.
    location = /healthz {
        access_log off;
        proxy_pass http://backend;
    }

    # ---- Frontend catch-all ----
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- nginx-itself healthcheck ----
    server {
        listen 80 default_server;
        server_name _;
        location = /nginx-health { return 200 "ok\n"; }
    }
}
