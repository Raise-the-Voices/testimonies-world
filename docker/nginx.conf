# nginx.conf — testimonies.world containerized deploy.
#
# Mirrors scripts/nginx/rtv-cases (the live deploy's nginx
# config) so the two surfaces are interchangeable. Routes:
#   /static/   → backend (whitenoise-served)
#   /media/    → backend (Django auth-gated download)
#   /api/      → backend
#   /admin/    → backend
#   /accounts/ → backend (allauth)
#   /events/   → backend (taiga-events)
#   /healthz   → backend (internal — NOT proxied publicly)
#   /          → frontend
#
# Public HTTPS is terminated upstream (Cloudflare/Caddy on the
# hypervisor). The loopback here is plain HTTP; Django trusts
# X-Forwarded-Proto via SECURE_PROXY_SSL_HEADER.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 25m;
    proxy_read_timeout 60s;
    proxy_buffering off;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Upstreams — service names resolve via compose DNS.
    upstream backend  { server backend:8040;  keepalive 16; }
    upstream frontend { server frontend:3000; keepalive 16; }

    # Forwarded headers — trusted because nginx is the only
    # hop in front of gunicorn in this topology.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ---- Backend-routed paths ----
    location /static/   { proxy_pass http://backend; }
    # /media/ is auth-gated by Django (serve_protected_media in
    # cases/views.py) — the old direct-from-disk alias was
    # removed in commit `b9c1bf0` because it let unauthenticated
    # users grab sensitive evidence files.
    location /media/    { proxy_pass http://backend; }
    location /api/      { proxy_pass http://backend; }
    location /admin/    { proxy_pass http://backend; }
    location /accounts/ { proxy_pass http://backend; }
    location /events/   { proxy_pass http://backend; }

    # /healthz — internal-only liveness probe. The upstream
    # nginx is in the same compose network, so it can reach
    # `backend:8040/healthz` directly. Do NOT expose this
    # path publicly — it would leak DB/cache error details.
    location = /healthz {
        access_log off;
        proxy_pass http://backend;
    }

    # ---- Frontend catch-all ----
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- nginx-itself healthcheck ----
    server {
        listen 80 default_server;
        server_name _;
        location = /nginx-health { return 200 "ok\n"; }
    }
}
