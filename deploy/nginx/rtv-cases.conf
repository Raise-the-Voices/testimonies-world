# Cases.raisethevoices.org — version-controlled nginx site config.
#
# TLS is terminated upstream (Proxmox Caddy). This nginx listens on plain
# HTTP only and forwards to the gunicorn (Django) and Node (SvelteKit)
# services on localhost.
#
# Routes:
#
#   /api/*         → Django (gunicorn :8040)
#   /media/*       → disk, permission-gated by Django auth_request
#   /__media_auth  → Django (internal; called by auth_request, not
#                    reachable from the public Internet)
#   /              → SvelteKit Node server (:3000) for SPA + SSR
#
# Media protection flow (C4):
#
#   1. Client requests /media/public/foo.jpg.
#   2. nginx matches the `location /media/` block and, before serving,
#      fires an internal sub-request to /__media_auth via auth_request.
#   3. Django's media_auth_check resolves the URL path to a Media row,
#      checks the user's visibility, and returns 200 (allowed) or 403
#      (denied). The response body is discarded; nginx only reads the
#      status code.
#   4. On 200, nginx serves the file from disk via `alias`. The file
#      body never traverses Django — auth_request is HTTP-only.
#   5. On 403, nginx returns 403 to the client.
#
# Why auth_request rather than proxying the file body through Django:
#
#   * Less CPU on Django (one HTTP sub-request per file, not one
#     FileResponse stream).
#   * nginx can set long expires / immutable cache headers on the
#     serving side without Django serializing them per response.
#   * The MediaDownloadView at cases.views.MediaDownloadView stays as a
#     safety net (callable when nginx is bypassed, e.g. local dev).
#
# Operational notes:
#
#   * Deploy script rsyncs this file to /etc/nginx/sites-available/cases
#     and runs `nginx -t && nginx -s reload`.
#   * MEDIA_ROOT is set in backend/testimonies/settings.py to
#     <backend>/media; C1 routes uploads into MEDIA_ROOT/{visibility}/
#     so the alias below resolves /media/public/x.jpg to
#     <backend>/media/public/x.jpg.

server {
    listen 80;
    server_name cases.raisethevoices.org;

    # --- API: Django via gunicorn ------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- Media: permission-gated, served from disk -------------------
    # The auth_request sub-request inherits the original request's
    # headers (including the session cookie), so Django sees the user
    # exactly as it would for a regular request.
    location /media/ {
        auth_request /__media_auth;

        # Map /media/<visibility>/ → <MEDIA_ROOT>/<visibility>/.
        # Trailing slash on the alias is required so the URL prefix is
        # replaced exactly (without it, /media/foo would become
        # /opt/rtv-cases/backend/mediafoo).
        alias /opt/rtv-cases/backend/media/;

        # Disk is the source of truth for the file body. If the file
        # isn't here, the auth_request must have been stale; return a
        # clean 404 rather than guessing.
        try_files $uri =404;

        # Long-cache media is fine for the public tier; restricted and
        # sensitive media URLs include per-row hashes in the filename
        # anyway, so the URL changes when the file does. 1y + immutable.
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- auth_request internal endpoint ------------------------------
    # Reachable only from inside nginx (auth_request). Rejects any
    # direct public access via `internal`. Forwards the original URI
    # to Django via X-Original-URI; the response code (200 / 403) is
    # the auth decision.
    location = /__media_auth {
        internal;
        proxy_pass http://127.0.0.1:8040/media/_auth_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length 0;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        # Don't carry over the original Cookie explicitly — auth_request
        # sub-requests inherit request headers including cookies, which
        # is what we want here (so Django's session auth works).
    }

    # --- Catch-all → SvelteKit Node server ---------------------------
    # Handles SPA routing (history fallback) and any non-API route.
    # The Node service serves its own build/client/_app/ assets; this
    # is unchanged from the previous setup.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
