name: CI

on:
  pull_request:
    branches: [main, feat/**, fix/**, refactor/**, hotfix/**]
  push:
    branches: [main, feat/**, fix/**, refactor/**, hotfix/**]

jobs:
  frontend:
    name: Frontend check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Typecheck (svelte-check)
        run: cd frontend && npm run check

      - name: Production build
        run: cd frontend && npm run build
        env:
          PUBLIC_BASE_PATH: '/testimonies'

  backend:
    name: Backend check + tests + migration drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: cd backend && pip install --no-cache-dir -r requirements.txt

      # `manage.py check` catches missing migration, bad import,
      # syntax error, etc. without needing the production DB.
      - name: Django check
        run: cd backend && python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-placeholder-not-secret
          DATABASE_URL: sqlite:///db.sqlite3
          USE_SQLITE: 'True'

      # Block any PR that introduces model changes without a migration.
      # Without this, the next deploy would 500 on the missing
      # `CREATE TABLE`/`ALTER COLUMN` and only the prod alert catches
      # it. Pin it in CI.
      - name: Migration drift check
        run: cd backend && python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-placeholder-not-secret
          DATABASE_URL: sqlite:///db.sqlite3
          USE_SQLITE: 'True'

      # Real test suite against an in-memory sqlite. The previous
      # version of this job ran only `manage.py check` which let
      # regressions through silently. `--keepdb` reuses the same
      # in-memory db across tests for speed; `--verbosity=2` makes
      # CI logs show the per-test outcome.
      - name: Run tests
        run: cd backend && python manage.py test --noinput --keepdb --verbosity=2
        env:
          DJANGO_SECRET_KEY: ci-placeholder-not-secret
          DATABASE_URL: 'sqlite://:memory:'
          USE_SQLITE: 'True'

      # API-drift gate. Runs in the backend job because it needs
      # Django + drf-spectacular (installed by `pip install -r
      # requirements.txt` above). Regenerates the OpenAPI schema
      # from the live serializers, generates the TypeScript client
      # from that schema, and fails if the committed copy differs.
      # Any serializer change without regenerating, or any
      # frontend-side type divergence, surfaces here.
      #
      # Node is bootstrapped here (the frontend job has it but the
      # backend job doesn't). orval is installed globally rather
      # than via `npm ci` because the drift gate only needs the CLI.
      - name: Setup Node for drift gate
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: API drift gate (gen:api:check)
        run: |
          npm install -g orval@^7
          cd frontend && npm run gen:api:check
        env:
          DJANGO_SECRET_KEY: ci-placeholder-not-secret
          USE_SQLITE: 'True'
          PUBLIC_BASE_PATH: '/testimonies'
