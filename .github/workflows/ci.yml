name: CI

on:
  pull_request:
    branches: [main, feat/**, fix/**, refactor/**, hotfix/**]
  push:
    branches: [main, feat/**, fix/**, refactor/**, hotfix/**]

jobs:
  frontend:
    name: Frontend check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck (svelte-check)
        working-directory: frontend
        run: npm run check

      - name: Production build
        working-directory: frontend
        run: npm run build
        env:
          PUBLIC_BASE_PATH: '/testimonies'

  backend:
    name: Backend smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        # Use --no-cache-dir to avoid stale pip wheels causing version drift
        # between local dev and CI. requirements.txt pins exact versions.
        run: pip install --no-cache-dir -r requirements.txt

      # `manage.py check` doesn't hit the database, so it works without
      # the production DATABASE_URL. Fails loudly if Django itself won't
      # boot (missing migration, bad import, syntax error, etc.).
      - name: Django check
        working-directory: backend
        run: python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-placeholder-not-secret
          DATABASE_URL: sqlite:///db.sqlite3
          USE_SQLITE: 'True'
