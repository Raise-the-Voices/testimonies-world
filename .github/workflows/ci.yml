name: CI

on:
  pull_request:
    branches: [main, feat/**, fix/**, refactor/**, hotfix/**]
  push:
    branches: [main, feat/**, fix/**, refactor/**, hotfix/**]

# ---------------------------------------------------------------------------
# Permissions: minimal. Pull requests don't need write access; only read.
# ---------------------------------------------------------------------------
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Concurrency: cancel in-progress runs for the same branch+PR. Saves CI
# minutes when a contributor force-pushes mid-build. The deploy job on
# main has its own concurrency group so a cancellation here doesn't
# cancel an in-flight deploy.
# ---------------------------------------------------------------------------
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Frontend — svelte-check + production build. Pure Node, no Django.
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # svelte-check catches type + svelte-specific errors. Warnings are
      # allowed to slip — keep them in CI logs for visibility without
      # blocking the merge.
      - name: Typecheck (svelte-check)
        run: cd frontend && npm run check

      - name: Production build
        run: cd frontend && npm run build
        env:
          PUBLIC_BASE_PATH: '/testimonies'

  # -------------------------------------------------------------------------
  # Backend — Django sanity + tests + migration drift. SQLite everywhere
  # (no DB credentials in the runner secret store; no network needed).
  # -------------------------------------------------------------------------
  backend:
    name: Backend check + tests + migration drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: cd backend && pip install --no-cache-dir -r requirements.txt

      # `manage.py check` catches missing migration, bad import, syntax
      # error, etc. without needing a real DB connection. SQLite is the
      # correct backend here (settings.py swaps to SQLite when USE_SQLITE=1).
      - name: Django check
        run: cd backend && python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-placeholder-not-secret
          USE_SQLITE: 'True'

      # Block any PR that introduces model changes without a migration.
      # Without this, the next deploy would 500 on the missing CREATE TABLE
      # / ALTER COLUMN and only the prod alert catches it.
      - name: Migration drift check
        run: cd backend && python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-placeholder-not-secret
          USE_SQLITE: 'True'

      # Real test suite against an in-memory sqlite (Django runner
      # honors USE_SQLITE — see settings.py SQLite swap). --keepdb
      # reuses the same in-memory db across tests for speed;
      # --verbosity=2 makes CI logs show the per-test outcome so a
      # regression can be located from the log alone.
      - name: Run tests
        run: cd backend && python manage.py test --noinput --keepdb --verbosity=2
        env:
          DJANGO_SECRET_KEY: ci-placeholder-not-secret
          USE_SQLITE: 'True'

  # -------------------------------------------------------------------------
  # API drift gate — separate job so a failure is unambiguous (not
  # "frontend might have failed because the backend part timed out").
  # Touches both Python (spectacular) and Node (orval) — both are
  # set up fresh here, no shared job-level cache coupling.
  #
  # Local regeneration must produce a byte-identical file. See
  # frontend/scripts/run-spectacular.js for the determinism contract,
  # and CI_CD_TROUBLESHOOTING.md for the diagnostic flow if this gate
  # ever fires a false positive.
  # -------------------------------------------------------------------------
  api-drift:
    name: API drift gate (OpenAPI ↔ generated TS)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python deps (drf-spectacular + orval source deps)
        run: cd backend && pip install --no-cache-dir -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node deps + orval (matches the version pin in package.json)
        run: |
          cd frontend
          npm ci
          # orval is a devDep so `npm ci` already installed it; no
          # global install needed.
          npx orval --version

      - name: Regenerate OpenAPI + TS client
        run: cd frontend && npm run gen:api
        env:
          DJANGO_SECRET_KEY: ci-not-secret
          USE_SQLITE: 'True'
          PUBLIC_BASE_PATH: '/testimonies'

      # The actual gate. --exit-code makes git return 1 on any diff.
      # We pair it with a follow-up `git diff` step so the failure
      # log shows the *change*, not just "tests fail". That makes
      # drift cases (someone forgot to regen after editing a
      # serializer) diagnosable from the log alone.
      - name: Compare against committed copy
        run: |
          if ! git diff --exit-code -- frontend/src/lib/api/generated/ openapi.yml; then
            echo
            echo '=== DRIFT DETECTED — diff above ==='
            echo 'Run `npm run gen:api` locally and commit the result.'
            exit 1
          fi

  # -------------------------------------------------------------------------
  # Aggregate gate — any failing job fails the run summary. GitHub
  # already does this with `needs`, but having a final `check` job
  # with `if: always()` gives one clear "all good / one job failed"
  # view in the PR conversation.
  # -------------------------------------------------------------------------
  check:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [frontend, backend, api-drift]
    if: always()
    steps:
      - name: Decide pass/fail
        run: |
          if [ "${{ needs.frontend.result }}"   = "success" ] \
          && [ "${{ needs.backend.result }}"    = "success" ] \
          && [ "${{ needs.api-drift.result }}"  = "success" ]; then
            echo 'All jobs passed.'
          else
            echo 'At least one job failed:'
            echo "  frontend:   ${{ needs.frontend.result }}"
            echo "  backend:    ${{ needs.backend.result }}"
            echo "  api-drift:  ${{ needs.api-drift.result }}"
            exit 1
          fi
