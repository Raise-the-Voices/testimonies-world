name: CI

on:
  pull_request:
    branches: [main, feat/**, fix/**, refactor/**, hotfix/**]
  push:
    branches: [main, feat/**, fix/**, refactor/**, hotfix/**]

# ---------------------------------------------------------------------------
# Permissions: minimal — read-only is enough for build/test/drift-gate.
# ---------------------------------------------------------------------------
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Frontend — svelte-check + production build. Pure Node, no Django.
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # svelte-check catches type + svelte-specific errors. Warnings are
      # left visible in CI logs without blocking the merge.
      - name: Typecheck (svelte-check)
        run: cd frontend && npm run check

      - name: Production build
        run: cd frontend && npm run build
        env:
          PUBLIC_BASE_PATH: '/testimonies'

  # -------------------------------------------------------------------------
  # Backend — Django check + migration drift + tests + the API drift gate.
  # All steps use SQLite via USE_SQLITE=True (no DB credentials in the
  # runner secret store; no network to the prod Postgres needed).
  #
  # The drift gate is the LAST step so a failure pinpoints exactly which
  # step diverged (env, schema, or types). If we kept it as a separate
  # job with `needs: [backend]`, a single failing step would either be
  # hidden behind another job's skip or coupled to unrelated output.
  # -------------------------------------------------------------------------
  backend:
    name: Backend check + tests + migration drift + API drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: cd backend && pip install --no-cache-dir -r requirements.txt

      # `manage.py check` catches missing migration, bad import, syntax
      # error, etc. SQLite swap in settings.py activates when USE_SQLITE=1.
      - name: Django check
        run: cd backend && python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-placeholder-not-secret
          USE_SQLITE: 'True'

      # Block any PR that introduces model changes without a migration.
      - name: Migration drift check
        run: cd backend && python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-placeholder-not-secret
          USE_SQLITE: 'True'

      # Real test suite against an in-memory sqlite. --keepdb reuses
      # the same in-memory db across tests for speed; --verbosity=2
      # makes CI logs show per-test outcomes.
      - name: Run tests
        run: cd backend && python manage.py test --noinput --keepdb --verbosity=2
        env:
          DJANGO_SECRET_KEY: ci-placeholder-not-secret
          USE_SQLITE: 'True'

      # ---- API drift gate (regenerate + diff committed) ----
      # drf-spectacular's BigIntegerField bounds are DB-bound: Postgres
      # emits ±2^63, SQLite emits ±2^31. CI uses SQLite (above); this
      # step forces the same on the local regen so local and CI
      # produce byte-identical openapi.yml. See
      # frontend/scripts/run-spectacular.js for the determinism
      # contract, and CI_CD_TROUBLESHOOTING.md for the diagnostic flow.
      - name: Setup Node (for drift gate)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps + orval sanity check
        run: |
          cd frontend
          npm ci
          npx orval --version

      - name: Regenerate OpenAPI + TS client
        run: cd frontend && npm run gen:api
        env:
          DJANGO_SECRET_KEY: ci-not-secret
          USE_SQLITE: 'True'

      # The actual gate. Print version + ls artifacts before the diff
      # so a failure log shows "what we ran" + "what it produced"
      # + "what diffs vs committed" all in one place.
      - name: Compare against committed copy (drift gate)
        run: |
          echo '--- versions ---'
          python --version
          npx orval --version
          cd backend && python -c "import django, drf_spectacular; print(f'django={django.__version__}', f'drf-spectacular={drf_spectacular.__version__}')" && cd ..
          echo '--- regenerated artifacts ---'
          ls -la openapi.yml frontend/src/lib/api/generated/
          echo '--- diff against committed ---'
          if ! git diff --exit-code -- openapi.yml frontend/src/lib/api/generated/; then
            echo
            echo '=== DRIFT DETECTED — diff above ==='
            echo 'Run `npm run gen:api` locally and commit the result.'
            exit 1
          fi
          echo 'No drift. openapi.yml and src/lib/api/generated/ match what CI just generated.'
