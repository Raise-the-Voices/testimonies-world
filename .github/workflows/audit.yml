name: Audit (Lighthouse CI on PR preview)

# Dedicated Lighthouse CI workflow for PRs targeting main. Kept separate
# from ci.yml so a perf-score regression fails the PR on its own merit
# (with branch protection wiring) instead of being silently green.
#
# The Lighthouse-CI thresholds here MUST match scripts/audit-lighthouse.sh
# so local and CI runs are equivalent. Source of truth for the numbers:
# frontend/.lighthouserc.json.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write        # treosh/lighthouse-ci-action posts PR comments

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Build the production bundle exactly as ci.yml does. Keeping
      # PUBLIC_BASE_PATH identical to the production deploy means
      # Lighthouse sees the same asset URLs that demos.linkedtrust.us
      # serves — i.e., a regression here is a regression there.
      - name: Install + build
        env:
          PUBLIC_BASE_PATH: /testimonies
        run: |
          cd frontend
          npm ci
          npm run build

      # Start the adapter-node server as a background job and poll the
      # homepage until it returns 200. We do NOT use lhci's own
      # startServerCommand: treosh/lighthouse-ci-action@v12's
      # collectChild-process-helper rejects with exit code 13 when the
      # server's server.init() top-level await hangs longer than
      # ~500ms before printing 'Listening on' — and that race has
      # nothing to do with our code. Spawning it ourselves lets us
      # poll the HTTP response (which SvelteKit only answers once
      # init() has resolved) and gives us a clean kill at the end.
      # PUBLIC_BASE_PATH and ORIGIN must match the URL below so
      # SvelteKit's path-base resolves to /testimonies and CSRF accepts
      # 127.0.0.1. PORT 4173 is Vite preview's default.
      - name: Start adapter-node server
        run: |
          cd frontend
          nohup env PUBLIC_BASE_PATH=/testimonies \
                    ORIGIN=http://127.0.0.1:4173 \
                    PORT=4173 \
                    node build/index.js \
              > /tmp/server.log 2>&1 &
          echo "server PID: $!"
          echo "$!" > /tmp/server.pid
          for i in $(seq 1 60); do
            sleep 1
            if curl -sf -o /dev/null http://127.0.0.1:4173/testimonies/; then
              echo "server ready after ${i}s"
              exit 0
            fi
          done
          echo "server failed to start within 60s. log:"
          cat /tmp/server.log
          kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          exit 1

      # We intentionally do NOT need a backend: the homepage loads with
      # a skeleton + auth check; if it 5xx's, performance scores catch
      # it. Real audits against seeded data happen in
      # scripts/audit-lighthouse.sh against a staging URL.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: frontend/.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true