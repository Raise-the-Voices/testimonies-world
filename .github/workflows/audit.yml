name: Audit (Lighthouse CI on PR preview)

# Dedicated Lighthouse CI workflow for PRs targeting main. Kept separate
# from ci.yml so a perf-score regression fails the PR on its own merit
# (with branch protection wiring) instead of being silently green.
#
# The Lighthouse-CI thresholds here MUST match scripts/audit-lighthouse.sh
# so local and CI runs are equivalent. Source of truth for the numbers:
# frontend/.lighthouserc.json.

on:
  pull_request:
    branches: [main]
    paths: ['frontend/**']   # skip on backend-only PRs
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write        # treosh/lighthouse-ci-action posts PR comments

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Build the production bundle exactly as ci.yml does. Keeping
      # PUBLIC_BASE_PATH identical to the production deploy means
      # Lighthouse sees the same asset URLs that demos.linkedtrust.us
      # serves — i.e., a regression here is a regression there.
      - name: Install + build
        env:
          PUBLIC_BASE_PATH: /testimonies
        run: |
          cd frontend
          npm ci
          npm run build

      # Audit H-7: boot `vite preview` on the production build, wait
      # for it to be ready, then run lhci autorun against it.
      # Vite preview serves the static build output — no adapter-node
      # boot, no top-level server.init() hang. The 30s readiness
      # poll catches the rare cold-start case.
      - name: Start preview server
        working-directory: frontend
        env:
          PUBLIC_BASE_PATH: /testimonies
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/testimonies/ >/dev/null 2>&1; then
              echo "preview ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "preview server did not become ready within 30s" >&2
          kill "$PREVIEW_PID" 2>/dev/null || true
          exit 1

      - name: Run Lighthouse CI
        working-directory: frontend
        # First PR after this wiring: continue-on-error so we observe
        # the actual numbers without failing the pipeline. Per project
        # direction (H-7), we'll drop this once we have a baseline.
        continue-on-error: true
        run: npx --yes @lhci/cli@0.14.x autorun --config=./.lighthouserc.json

      # Real audits against seeded data happen in
      # scripts/audit-lighthouse.sh against a staging URL.
      - name: Cleanup preview server
        if: always()
        run: |
          pkill -f "vite preview" 2>/dev/null || true
          pkill -f "node.*preview" 2>/dev/null || true
