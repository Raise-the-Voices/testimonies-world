name: Deploy to production

# Two triggers, both gated on CI being green:
#
#   1. `push` to main            — the normal flow. Branch protection on
#      main requires the `backend`, `frontend-tests`, and `backend-pg`
#      checks to pass before a PR can merge, so a push here already
#      implies CI green. The `if:` on the job below re-verifies it
#      defensively (branch protection can be bypassed by admins).
#
#   2. `workflow_run` from CI    — fires after the CI workflow completes
#      on main. This is the cross-workflow gate: even if someone bypasses
#      branch protection or force-pushes, the CI workflow must report
#      `success` for this deploy to run. Without this trigger, a direct
#      push to main with red CI would silently deploy.
#
#   3. `workflow_dispatch`       — a manual deploy, for when the site is
#      down and the fix is already on main. It skips the CI gate; both
#      jobs still declare the `production` environment, so whatever
#      protection rules that environment carries apply to it as well.
#
# The triggers share the same concurrency group, so a push-to-main
# event and a `workflow_run` event arriving back-to-back collapse into
# one in-flight deploy rather than racing each other.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Two deploys to prod must NEVER run in parallel. `cancel-in-progress:
# false` means a second deploy waits for the first to finish — safer than
# cancelling a half-deployed prod. Group key includes the workflow name
# so this doesn't collide with any future staging deploy.
concurrency:
  group: deploy-prod-${{ github.workflow }}
  cancel-in-progress: false

# Permissions: minimal — the deploy reads the repo and talks to the VM
# over SSH with a deploy key. No token, no contents write.
permissions:
  contents: read

jobs:
  # ----- build -----------------------------------------------------------
  # Builds the SvelteKit frontend in CI instead of on the prod VM. CI is
  # already Node 22; pushing the build off-host removes the Node-version
  # bootstrap, the `npm ci` cost, and the orval/engine-strict class of
  # deploy failures that hit prod in 2026-09.
  build:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # The `production` GitHub Environment (configured in repo Settings →
    # Environments) gives us a required-reviewer gate for emergency
    # bypass (when CI is red during an active outage) and environment-
    # scoped secrets. Build doesn't need secrets, but pinning the env
    # here ties deploys to the same required-review workflow for both
    # jobs.
    environment:
      name: production
      url: https://demos.linkedtrust.us/testimonies/

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # PUBLIC_BASE_PATH controls both the runtime base + the build's
      # output directory layout (svelte.config.js reads it at config-
      # load time and sets `paths.base`). The value comes from
      # frontend/.env.production (single source of truth; also read by
      # the systemd unit via EnvironmentFile=). We export it here so
      # svelte.config.js sees it during its pre-Vite load. If the file
      # is missing or empty, fail loudly — silent drift has caused
      # repeated 404 storms.
      - name: Build SvelteKit with prod base path
        run: |
          cd frontend
          if [ ! -s .env.production ]; then
            echo "::error::frontend/.env.production missing or empty"
            exit 1
          fi
          export PUBLIC_BASE_PATH="$(grep -E '^PUBLIC_BASE_PATH=' .env.production | cut -d= -f2- | tr -d '"')"
          if [ -z "$PUBLIC_BASE_PATH" ]; then
            echo "::error::PUBLIC_BASE_PATH not set in frontend/.env.production"
            exit 1
          fi
          npm run build

      # `if-no-files-found: error` makes a missing build fail loudly
      # instead of producing an empty scp payload that would 404 every
      # /testimonies/_app/ request on prod. Retention 7d matches the
      # typical rollback window — old artifacts are deleted by GitHub
      # automatically.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7
          if-no-files-found: error

  # ----- deploy ----------------------------------------------------------
  # Pulls the build artifact, scps it to the VM, then runs deploy.sh.
  # The SSH step mirrors what was inline before: a narrowly-scoped
  # `git checkout origin/main -- <paths>` refreshes the source on the
  # VM without `git reset --hard` (which is the structural cause of
  # the autostash + settings.py-merge-conflict class of failures). We
  # do NOT touch frontend/build/ on the VM via git — it's gitignored;
  # the artifact is the source of truth.
  deploy:
    needs: build
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: https://demos.linkedtrust.us/testimonies/

    runs-on: ubuntu-latest
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-build

      - name: Push build to VM over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        # Plain ssh/scp, not appleboy/scp-action + appleboy/ssh-action.
        # Those actions download a helper binary (drone-scp, drone-ssh)
        # from a GitHub release on every run; when that release CDN
        # answers 504 the deploy fails before it reaches the VM — which
        # is what happened on 2026-11-08, twice, with the site already
        # down. The runner has OpenSSH built in, so the deploy depends
        # on nothing but the runner image.
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/deploy_key /tmp/frontend-build.tar.gz' EXIT
          printf '%s' "$DEPLOY_KEY" | tr -d '\r' > /tmp/deploy_key

          # One tarball instead of a tree of scp calls: the client
          # bundle is hundreds of small files and scp opens a
          # connection per file. The archive is unpacked into the path
          # deploy.sh reads — /tmp/frontend-build-incoming/client/... —
          # so the layout is the one deploy.sh's INCOMING_FRONTEND
          # check expects.
          tar -czf /tmp/frontend-build.tar.gz -C frontend-build .

          # /tmp instead of /opt: the SSH user (DEPLOY_USER) can't
          # mkdir -p under /opt/ on prod without sudo, and this step
          # runs before the one that can sudo. /tmp is world-writable,
          # so the directory is created with zero per-machine setup,
          # and it only has to live for the length of this step.
          ssh -i /tmp/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'rm -rf /tmp/frontend-build-incoming && mkdir -p /tmp/frontend-build-incoming'
          scp -i /tmp/deploy_key -P "${DEPLOY_PORT:-22}" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            /tmp/frontend-build.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/frontend-build.tar.gz"
          ssh -i /tmp/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'tar -xzf /tmp/frontend-build.tar.gz -C /tmp/frontend-build-incoming && rm -f /tmp/frontend-build.tar.gz'

      - name: Run deploy.sh on VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/deploy_key' EXIT
          printf '%s' "$DEPLOY_KEY" | tr -d '\r' > /tmp/deploy_key
          # The script below runs on the VM, not here: the heredoc is
          # quoted, so nothing in it is expanded by this shell — `$` and
          # `$(...)` are the VM's to evaluate.
          ssh -i /tmp/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
            set -e

            cd /opt/rtv-cases

            # Take ownership of /opt/rtv-cases for this run. The SSH
            # user (DEPLOY_USER) does not own the repo on prod — so
            # `git fetch`/`git checkout` would otherwise fail with
            # "Permission denied" on .git/FETCH_HEAD or any tracked
            # file in the checkout list below. sudo is passwordless
            # for this user. Idempotent — a no-op once ownership
            # already matches.
            sudo chown -R "$(whoami)" /opt/rtv-cases

            # Mark the deploy checkout as a safe.directory for whatever
            # user we end up as. Git 2.35.2+ refuses to operate on a
            # repo owned by a different UID unless explicitly
            # allowlisted — the deploy user doesn't own
            # /opt/rtv-cases on prod, so `git fetch`/`git reset` would
            # otherwise fail with "detected dubious ownership" (run
            # #216, 2026-09-21). Narrow path keeps the allowlist
            # minimal.
            git config --global --add safe.directory /opt/rtv-cases

            # Source refresh: narrow, never `reset --hard`. Untracked
            # host files (backend/.env, any vetted per-host tweaks)
            # are preserved. frontend/build/ is gitignored and is
            # overwritten by the artifact scp step, not by git.
            git fetch origin main
            git checkout origin/main -- \
              backend/requirements.txt \
              backend/cases/ \
              backend/testimonies/ \
              backend/manage.py \
              frontend/.env.production \
              scripts/deploy.sh \
              scripts/nginx/rtv-cases \
              scripts/systemd/

            bash scripts/deploy.sh
          REMOTE
