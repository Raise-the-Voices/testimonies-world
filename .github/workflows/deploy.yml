name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd /opt/rtv-cases

            # Mark the deploy checkout as a safe.directory for
            # whatever user appleboy/ssh-action logs in as. Git
            # 2.35.2+ refuses to operate on a repo owned by a
            # different UID without an explicit allowlist — the
            # SSH-action user doesn't own /opt/rtv-cases on prod,
            # so `git fetch` below would otherwise fail with
            # "detected dubious ownership" and abort the deploy
            # before deploy.sh is even invoked (run #216,
            # 2026-09-21). Must run inside this YAML `script:`
            # block — putting it in deploy.sh is too late because
            # the first git op here is the one that fails.
            git config --global --add safe.directory /opt/rtv-cases

            # Bootstrap deploy.sh to the latest tracked version.
            # The workflow can't depend on the host's deploy.sh being
            # up to date — otherwise an out-of-date script can fail
            # the very pull that would have fixed it.
            git fetch origin main
            git checkout origin/main -- scripts/deploy.sh

            # Now run the (latest) deploy.sh, which autostashes local
            # edits before pulling.
            bash scripts/deploy.sh