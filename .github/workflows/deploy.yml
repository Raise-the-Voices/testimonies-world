name: Deploy to production

# Two triggers, both gated on CI being green:
#
#   1. `push` to main            — the normal flow. Branch protection on
#      main requires the `backend`, `frontend-tests`, and `backend-pg`
#      checks to pass before a PR can merge, so a push here already
#      implies CI green. The `if:` on the job below re-verifies it
#      defensively (branch protection can be bypassed by admins).
#
#   2. `workflow_run` from CI    — fires after the CI workflow completes
#      on main. This is the cross-workflow gate: even if someone bypasses
#      branch protection or force-pushes, the CI workflow must report
#      `success` for this deploy to run. Without this trigger, a direct
#      push to main with red CI would silently deploy.
#
# The two triggers share the same concurrency group, so a push-to-main
# event and a `workflow_run` event arriving back-to-back collapse into
# one in-flight deploy rather than racing each other.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Two deploys to prod must NEVER run in parallel. `cancel-in-progress:
# false` means a second deploy waits for the first to finish — safer than
# cancelling a half-deployed prod. Group key includes the workflow name
# so this doesn't collide with any future staging deploy.
concurrency:
  group: deploy-prod-${{ github.workflow }}
  cancel-in-progress: false

# Permissions: minimal — only what `appleboy/scp-action` +
# `appleboy/ssh-action` need (which is nothing, they use secrets via
# `with:`). No token, no contents write.
permissions:
  contents: read

jobs:
  # ----- build -----------------------------------------------------------
  # Builds the SvelteKit frontend in CI instead of on the prod VM. CI is
  # already Node 22; pushing the build off-host removes the Node-version
  # bootstrap, the `npm ci` cost, and the orval/engine-strict class of
  # deploy failures that hit prod in 2026-09.
  build:
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    # The `production` GitHub Environment (configured in repo Settings →
    # Environments) gives us a required-reviewer gate for emergency
    # bypass (when CI is red during an active outage) and environment-
    # scoped secrets. Build doesn't need secrets, but pinning the env
    # here ties deploys to the same required-review workflow for both
    # jobs.
    environment:
      name: production
      url: https://demos.linkedtrust.us/testimonies/

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # PUBLIC_BASE_PATH controls both the runtime base + the build's
      # output directory layout (svelte.config.js reads it at config-
      # load time and sets `paths.base`). Without /testimonies set,
      # vite emits the bundle at build/client/_app/ — not
      # build/client/testimonies/_app/, which is the layout deploy.sh
      # rsyncs to /var/www/cases/. Mirrors the systemd unit's env so
      # the dev URL prod-builds identically.
      - name: Build SvelteKit with prod base path
        run: cd frontend && PUBLIC_BASE_PATH=/testimonies npm run build

      # `if-no-files-found: error` makes a missing build fail loudly
      # instead of producing an empty scp payload that would 404 every
      # /testimonies/_app/ request on prod. Retention 7d matches the
      # typical rollback window — old artifacts are deleted by GitHub
      # automatically.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7
          if-no-files-found: error

  # ----- deploy ----------------------------------------------------------
  # Pulls the build artifact, scps it to the VM, then runs deploy.sh.
  # The SSH step mirrors what was inline before: a narrowly-scoped
  # `git checkout origin/main -- <paths>` refreshes the source on the
  # VM without `git reset --hard` (which is the structural cause of
  # the autostash + settings.py-merge-conflict class of failures). We
  # do NOT touch frontend/build/ on the VM via git — it's gitignored;
  # the artifact is the source of truth.
  deploy:
    needs: build
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: https://demos.linkedtrust.us/testimonies/

    runs-on: ubuntu-latest
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/frontend-build

      - name: Push build to VM via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # /tmp/<dir> instead of /opt/<dir>: the SSH user (DEPLOY_USER)
          # can't `mkdir -p` under /opt/ on prod without sudo, and the
          # scp-action attempts `create folder` on the target BEFORE the
          # SSH step that could sudo. /tmp is world-writable so the dir
          # is created cleanly with zero per-machine setup. The artifact
          # only needs to live for the duration of one SSH step (sub-
          # second), so /tmp's volatility is a non-issue.
          #
          # Trailing slashes on BOTH source and target are significant:
          # they tell rsync (the scp-action backend) to copy the
          # directory's CONTENTS into the target, not nest the source
          # directory under it. Without the source slash, files landed
          # at /tmp/frontend-build-incoming/frontend-build/... and
          # deploy.sh's INCOMING_FRONTEND lookup failed (run
          # #36441619050, 2026-09-28).
          source: "dist/frontend-build/"
          target: "/tmp/frontend-build-incoming/"

      - name: Run deploy.sh on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e

            cd /opt/rtv-cases

            # Take ownership of /opt/rtv-cases for this run. The SSH
            # user (DEPLOY_USER) does not own the repo on prod — so
            # `git fetch`/`git checkout` would otherwise fail with
            # "Permission denied" on .git/FETCH_HEAD or any tracked
            # file in the checkout list below. sudo is passwordless
            # for this user. Idempotent — a no-op once ownership
            # already matches.
            sudo chown -R "$(whoami)" /opt/rtv-cases

            # Mark the deploy checkout as a safe.directory for whatever
            # user we end up as. Git 2.35.2+ refuses to operate on a
            # repo owned by a different UID unless explicitly
            # allowlisted — the deploy user doesn't own
            # /opt/rtv-cases on prod, so `git fetch`/`git reset` would
            # otherwise fail with "detected dubious ownership" (run
            # #216, 2026-09-21). Narrow path keeps the allowlist
            # minimal.
            git config --global --add safe.directory /opt/rtv-cases

            # Source refresh: narrow, never `reset --hard`. Untracked
            # host files (backend/.env, any vetted per-host tweaks)
            # are preserved. frontend/build/ is gitignored and is
            # overwritten by the artifact scp step, not by git.
            git fetch origin main
            git checkout origin/main -- \
              backend/requirements.txt \
              backend/cases/ \
              backend/testimonies/ \
              backend/manage.py \
              scripts/deploy.sh \
              scripts/nginx/rtv-cases \
              scripts/systemd/

            bash scripts/deploy.sh
