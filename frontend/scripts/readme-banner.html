<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Testimonies.world — README banner</title>
<style>
	/* Brand tokens copied from frontend/src/app.css so the banner and
	   the app stay in one palette. */
	@font-face {
		font-family: 'PT Sans';
		font-style: normal;
		font-weight: 400;
		src: url('../../node_modules/@fontsource/pt-sans/files/pt-sans-latin-400-normal.woff2') format('woff2');
	}
	@font-face {
		font-family: 'PT Sans';
		font-style: normal;
		font-weight: 700;
		src: url('../../node_modules/@fontsource/pt-sans/files/pt-sans-latin-700-normal.woff2') format('woff2');
	}

	* { box-sizing: border-box; }

	html, body {
		margin: 0;
		padding: 0;
		width: 1200px;
		height: 360px;
	}

	body {
		font-family: 'PT Sans', system-ui, sans-serif;
		color: #fafafa;
		background:
			radial-gradient(900px 420px at 88% -12%, rgba(71, 124, 129, 0.55) 0%, rgba(37, 100, 106, 0) 70%),
			linear-gradient(120deg, #25646a 0%, #1b4a4f 58%, #16383c 100%);
		display: flex;
		flex-direction: column;
		justify-content: center;
		padding: 0 72px;
		position: relative;
		overflow: hidden;
	}

	/* Faint dot-grid on the right — the "record" texture behind the
	   case grid on /persons. */
	.dots {
		position: absolute;
		right: -40px;
		top: -40px;
		width: 460px;
		height: 440px;
		background-image: radial-gradient(rgba(250, 250, 250, 0.22) 2px, transparent 2px);
		background-size: 22px 22px;
		opacity: 0.55;
	}

	.eyebrow {
		font-size: 15px;
		letter-spacing: 0.22em;
		text-transform: uppercase;
		font-weight: 700;
		color: rgba(250, 250, 250, 0.72);
		margin: 0 0 14px;
	}

	h1 {
		font-size: 62px;
		line-height: 1.02;
		font-weight: 700;
		margin: 0 0 18px;
		letter-spacing: -0.015em;
	}

	.tagline {
		font-size: 21px;
		line-height: 1.5;
		max-width: 660px;
		margin: 0;
		color: rgba(250, 250, 250, 0.9);
	}

	.chips {
		display: flex;
		gap: 10px;
		margin-top: 26px;
	}

	.chip {
		font-size: 14px;
		font-weight: 700;
		letter-spacing: 0.02em;
		padding: 7px 14px;
		border-radius: 999px;
		background: rgba(250, 250, 250, 0.12);
		border: 1px solid rgba(250, 250, 250, 0.28);
		color: #fafafa;
	}

	.chip--solid {
		background: #fafafa;
		border-color: #fafafa;
		color: #25646a;
	}
</style>
</head>
<body>
	<div class="dots"></div>

	<p class="eyebrow">Raise the Voices &middot; Casework Platform</p>
	<h1>Testimonies.world</h1>
	<p class="tagline">
		Person-centered casework for people facing enforced disappearance,
		arbitrary detention, restricted rights and statelessness.
	</p>

	<div class="chips">
		<span class="chip chip--solid">Person-centered records</span>
		<span class="chip">Encrypted sources</span>
		<span class="chip">Public archive</span>
	</div>
</body>
</html>
