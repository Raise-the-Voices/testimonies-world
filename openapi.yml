        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        signal:
          type: string
          maxLength: 50
        whatsapp:
          type: string
          maxLength: 50
        notes:
          type: string
        persons:
          type: array
          items:
            type: integer
      required:
      - name
    CountryCountEntry:
