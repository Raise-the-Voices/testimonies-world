      properties:
        id:
          type: integer
          readOnly: true
        file:
          type: string
          format: uri
          nullable: true
          pattern: (?:jpg|jpeg|png|gif|webp|heic|tiff|bmp|pdf|mp4|mov|webm)$
        url:
          type: string
          format: uri
          maxLength: 1000
        media_type:
          $ref: '#/components/schemas/MediaTypeEnum'
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        description:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        person:
          type: integer
          nullable: true
        report:
          type: integer
          nullable: true
        uploaded_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - uploaded_by
    MediaRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          nullable: true
          pattern: (?:jpg|jpeg|png|gif|webp|heic|tiff|bmp|pdf|mp4|mov|webm)$
        url:
          type: string
          format: uri
          maxLength: 1000
        media_type:
