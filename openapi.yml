      - id
      - is_private
      - person
      - person_name
      - source_type
    DashboardResponse:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        summary:
          $ref: '#/components/schemas/DashboardSummary'
        recent_persons:
          type: array
          items:
            $ref: '#/components/schemas/DashboardPerson'
        recent_reports:
          type: array
          items:
            $ref: '#/components/schemas/DashboardReport'
        recent_casework:
          type: array
          items:
            $ref: '#/components/schemas/DashboardCasework'
        activity:
          type: array
          items:
            $ref: '#/components/schemas/DashboardActivityEntry'
        by_status:
          type: object
          additionalProperties:
            type: integer
          description: Person count grouped by current_status (detained, disappeared,
            released, deceased, etc.). Mirrors /api/persons/statistics/ for consistency
            with the public stats page.
