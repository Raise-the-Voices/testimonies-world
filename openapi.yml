openapi: 3.0.3
info:
  title: Testimonies.world API
  version: 1.0.0
  description: Casework platform for documenting human rights cases. Sensitive endpoints
    (contacts, sensitive media) require authentication.
paths:
  /api/casework/:
    get:
      operationId: casework_list
      parameters:
      - in: query
        name: action_type
        schema:
          type: string
          enum:
          - advocacy
          - investigation
          - legal_filing
          - media
          - other
          - outreach
        description: |-
          * `outreach` - Outreach
          * `legal_filing` - Legal filing
          * `media` - Media engagement
          * `advocacy` - Advocacy
          * `investigation` - Investigation
          * `other` - Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: performed_by
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - done
          - in_progress
          - open
        description: |-
          * `open` - Open
          * `in_progress` - In progress
          * `done` - Done
      tags:
      - casework
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCaseworkRecordList'
          description: ''
    post:
      operationId: casework_create
      tags:
      - casework
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseworkRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CaseworkRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaseworkRecordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseworkRecord'
          description: ''
  /api/casework/{id}/:
    get:
      operationId: casework_retrieve
      description: |-
        GET a record. Side effect: mark the caller's own notifications
        on this record as read, and emit a 'seen by' notification to the
        author — the human-sense "verification" the feature is named for.
        Also writes an AuditLog.VIEWED row so casework-record views are
        in the same paper trail as Person / Report / Media views.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this casework record.
        required: true
      tags:
      - casework
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseworkRecord'
          description: ''
    put:
      operationId: casework_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this casework record.
        required: true
      tags:
      - casework
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseworkRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CaseworkRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaseworkRecordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseworkRecord'
          description: ''
    patch:
      operationId: casework_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this casework record.
        required: true
      tags:
      - casework
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCaseworkRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCaseworkRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCaseworkRecordRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseworkRecord'
          description: ''
    delete:
      operationId: casework_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this casework record.
        required: true
      tags:
      - casework
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
