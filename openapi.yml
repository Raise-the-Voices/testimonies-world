  /api/media/:
    get:
      operationId: media_list
      description: |-
        Media CRUD.

        Reads are gated by visibility (see `get_queryset`): anonymous sees only
        public; authenticated non-advocates see public+restricted; advocates
        and staff see everything. That's the existing behavior.

        Permission: `IsAuthenticatedOrReadOnly` — public media remains
        browsable without login (a person detail page with a public photo
        should work for anonymous viewers). Sensitive media is gated separately
        inside `perform_create` / `perform_update`: only advocates and staff
        can put a row in the `sensitive` tier. This blocks a volunteer from
        accidentally (or otherwise) marking evidence as sensitive, which
        would hide it from other volunteers mid-investigation.
      parameters:
      - in: query
        name: media_type
        schema:
          type: string
          enum:
          - document
          - link
          - photo
          - video
        description: |-
          * `photo` - Photo
          * `document` - Document
          * `video` - Video
          * `link` - External link
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: person
        schema:
          type: integer
      - in: query
        name: report
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: visibility
        schema:
          type: string
          enum:
          - public
          - restricted
          - sensitive
        description: |-
          * `public` - Public
          * `restricted` - Restricted — authenticated users only
          * `sensitive` - Sensitive — advocates/admin only
      tags:
      - media
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaList'
          description: ''
    post:
      operationId: media_create
      description: |-
        Media CRUD.

        Reads are gated by visibility (see `get_queryset`): anonymous sees only
        public; authenticated non-advocates see public+restricted; advocates
        and staff see everything. That's the existing behavior.

        Permission: `IsAuthenticatedOrReadOnly` — public media remains
        browsable without login (a person detail page with a public photo
        should work for anonymous viewers). Sensitive media is gated separately
        inside `perform_create` / `perform_update`: only advocates and staff
        can put a row in the `sensitive` tier. This blocks a volunteer from
        accidentally (or otherwise) marking evidence as sensitive, which
        would hide it from other volunteers mid-investigation.
      tags:
