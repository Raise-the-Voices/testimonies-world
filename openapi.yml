      - released
      - deceased
      - unknown
      - stateless
      - rights_restricted
      - ongoing_enforced_disappearance
      - found_alive
      - found_dead
      - case_closed
      - other
      type: string
      description: |-
        * `detained` - Detained
        * `disappeared` - Disappeared
        * `restricted_movement` - Restricted Movement
        * `released` - Released
        * `deceased` - Deceased
        * `unknown` - Unknown
        * `stateless` - Stateless
        * `rights_restricted` - Rights Restricted
        * `ongoing_enforced_disappearance` - Ongoing alleged enforced disappearance
        * `found_alive` - Found alive
        * `found_dead` - Found dead
        * `case_closed` - Case closed
        * `other` - Other
    DashboardActivityEntry:
