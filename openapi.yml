    TestimonialPublic:
      type: object
      description: |-
        Public-facing payload — masks source + location by visibility flags.

        Server-side masking is the security boundary (SYSTEM_RULES §10).
        The frontend never sees redacted fields in the first place.

        The `source_visible` boolean captures whether *any* source
        descriptor is shown publicly (public_named / public_anonymous).
        Hidden rows surface `null`.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
        language:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        region:
          type: string
          readOnly: true
        public_location_display:
          type: string
          readOnly: true
        incident_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        incident_types:
          readOnly: true
        summary:
          type: string
          readOnly: true
        narrative:
          type: string
          readOnly: true
        outcome:
          type: string
          readOnly: true
        verification_level:
          allOf:
          - $ref: '#/components/schemas/VerificationLevelEnum'
          readOnly: true
        source_visible:
          type: boolean
          readOnly: true
        public_source_label:
          type: string
