openapi: 3.0.3
info:
  title: Testimonies.world API
  version: 1.0.0
  description: Casework platform for documenting human rights cases. Sensitive endpoints
    (contacts, sensitive media) require authentication.
paths:
  /api/audit-logs/:
    get:
      operationId: audit_logs_list
      description: Staff-only audit log. Paginated, filterable by user/action/target_type/timestamp
        range. Every CRUD op on a sensitive viewset writes a row here via the `_audit()`
        helper.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - deleted
          - downloaded
          - edited
          - viewed
        description: |-
          * `viewed` - Viewed
          * `downloaded` - Downloaded
          * `edited` - Edited
          * `deleted` - Deleted
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      - in: query
        name: timestamp_after
        schema:
          type: string
          format: date-time
      - in: query
        name: timestamp_before
        schema:
          type: string
          format: date-time
      - in: query
        name: user__username
        schema:
          type: string
      tags:
      - audit-logs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: |-
        Read-only API for AuditLog rows.

        Permission: `IsAdminUser` (DRF built-in). Anonymous → 401,
        authenticated non-staff → 403, staff → 200. No write endpoints:
        audit rows are write-once by design (every row is created by an
        `_audit()` helper inside the originating viewset's perform_*
        method).

        Filters (via django-filter, all optional):
          ?user__username=...        exact match
          ?action=viewed|edited|...   exact match
          ?target_type=person|...    exact match
          ?timestamp_after=ISO       >= timestamp
          ?timestamp_before=ISO      <= timestamp
          ?search=...                text search over details, ip_address,
                                     user__username (DRF SearchFilter)
          ?ordering=timestamp        default is -timestamp
          ?page=N                    default page size 10
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - audit-logs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/casework/:
    get:
      operationId: casework_list
      parameters:
      - in: query
        name: action_type
        schema:
          type: string
          enum:
          - advocacy
          - investigation
          - legal_filing
          - media
          - other
          - outreach
        description: |-
          * `outreach` - Outreach
          * `legal_filing` - Legal filing
          * `media` - Media engagement
          * `advocacy` - Advocacy
          * `investigation` - Investigation
          * `other` - Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: performed_by
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - done
          - in_progress
          - open
        description: |-
          * `open` - Open
          * `in_progress` - In progress
          * `done` - Done
      tags:
      - casework
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCaseworkRecordList'
          description: ''
    post:
      operationId: casework_create
      tags:
      - casework
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseworkRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CaseworkRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaseworkRecordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseworkRecord'
          description: ''
  /api/casework/{id}/:
    get:
      operationId: casework_retrieve
      description: |-
        GET a record. Side effect: mark the caller's own notifications
        on this record as read, and emit a 'seen by' notification to the
        author — the human-sense "verification" the feature is named for.
        Also writes an AuditLog.VIEWED row so casework-record views are
        in the same paper trail as Person / Report / Media views.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this casework record.
        required: true
      tags:
      - casework
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseworkRecord'
          description: ''
    put:
      operationId: casework_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this casework record.
        required: true
      tags:
      - casework
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseworkRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CaseworkRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaseworkRecordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseworkRecord'
          description: ''
    patch:
      operationId: casework_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this casework record.
        required: true
      tags:
      - casework
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCaseworkRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCaseworkRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCaseworkRecordRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseworkRecord'
          description: ''
    delete:
      operationId: casework_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this casework record.
        required: true
      tags:
      - casework
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
