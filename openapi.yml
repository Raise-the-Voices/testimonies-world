components:
  schemas:
    ActionEnum:
      enum:
      - viewed
      - downloaded
      - edited
      - deleted
      type: string
      description: |-
        * `viewed` - Viewed
        * `downloaded` - Downloaded
        * `edited` - Edited
        * `deleted` - Deleted
    ActionTypeEnum:
      enum:
      - outreach
      - legal_filing
      - media
      - advocacy
      - investigation
      - other
      type: string
      description: |-
        * `outreach` - Outreach
        * `legal_filing` - Legal filing
        * `media` - Media engagement
        * `advocacy` - Advocacy
        * `investigation` - Investigation
        * `other` - Other
    AdditionalSourceTypeEnum:
      enum:
      - lawyer
      - ngo
      - media
      - court
      - government
      - other
      type: string
      description: |-
        * `lawyer` - Lawyer
        * `ngo` - NGO
        * `media` - Media
        * `court` - Court
        * `government` - Government
        * `other` - Other
    AuditLog:
      type: object
      description: |-
        Read-only serializer for the AuditLog API at /api/audit-logs/.

        Used by staff-only via AuditLogViewSet (IsAdminUser). The `user`
        field is rendered as a primary-key integer for predictability
        across the API surface — the frontend resolves the FK to a
        username by joining against the user list it already has, rather
        than us nesting a User object on every audit row (which would
        bloat list payloads and let stale username data leak into the
        audit response after a rename).

        If a user was deleted (SET_NULL) the FK is null — the frontend
        renders '—' for those rows.
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: integer
          readOnly: true
        details:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
      required:
      - action
      - details
      - id
      - ip_address
      - target_id
      - target_type
      - timestamp
      - user
    BlankEnum:
      enum:
      - ''
    CaseCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - id
      - name
    CaseworkRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        performed_by_name:
          type: string
          readOnly: true
        seen_by:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
          readOnly: true
        action_type:
          $ref: '#/components/schemas/ActionTypeEnum'
        description:
          type: string
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/CaseworkRecordStatusEnum'
        next_steps:
          type: string
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        performed_by:
          type: integer
          readOnly: true
          nullable: true
        persons:
          type: array
          items:
            type: integer
      required:
      - created_at
      - date
      - description
      - id
      - performed_by
      - performed_by_name
      - seen_by
      - updated_at
    CaseworkRecordRequest:
      type: object
      properties:
        action_type:
          $ref: '#/components/schemas/ActionTypeEnum'
        description:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/CaseworkRecordStatusEnum'
        next_steps:
          type: string
        notes:
          type: string
        persons:
          type: array
          items:
            type: integer
      required:
      - date
      - description
    CaseworkRecordStatusEnum:
      enum:
      - open
      - in_progress
      - done
      type: string
      description: |-
        * `open` - Open
        * `in_progress` - In progress
        * `done` - Done
    CategoryCount:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
      required:
      - count
      - name
    ConsentStatusEnum:
      enum:
      - 'yes'
      - 'no'
      - pending
      type: string
      description: |-
        * `yes` - Yes
        * `no` - No
        * `pending` - Pending
    Contact:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        signal:
          type: string
          maxLength: 50
        whatsapp:
          type: string
          maxLength: 50
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        persons:
          type: array
          items:
            type: integer
      required:
      - created_at
      - deleted_at
      - id
      - name
    ContactRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        role:
