  /api/persons/:
    get:
      operationId: persons_list
      description: |-
        Person CRUD.

        Read access (list / retrieve): anyone (anonymous included) can read
        published persons. `get_queryset` filters out unpublished rows for
        anonymous viewers.

        Write access (create / update / destroy):
            - Must be authenticated (`IsAuthenticatedOrReadOnly`).
            - Must be a Volunteer, Advocate, or staff (`IsVolunteer`).

        Delete is hard-delete (not soft) — Person has no provenance
        requirement like Contact does (see contacts/views.py). FKs are CASCADE
        in models.py, so deleting a Person removes its Reports (and any
        Media those Reports reference), its Media rows, and any
        FamilyRelationship rows on either end. The underlying files
        (profile image, uploaded media) are removed automatically by
        Django 3.1+'s FileField behaviour.

        Every delete writes a single `AuditLog` row capturing the snapshot
        *before* the row vanishes, so the deletion is traceable even after
        the Person row is gone.
      parameters:
      - in: query
        name: category
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      - in: query
        name: country
        schema:
          type: string
      - in: query
        name: current_status
        schema:
          type: string
          enum:
          - deceased
          - detained
          - disappeared
          - released
          - restricted_movement
          - rights_restricted
          - stateless
          - unknown
        description: |-
          * `detained` - Detained
          * `disappeared` - Disappeared
          * `restricted_movement` - Restricted Movement
          * `released` - Released
          * `deceased` - Deceased
          * `unknown` - Unknown
          * `stateless` - Stateless
          * `rights_restricted` - Rights Restricted
      - in: query
        name: gender
        schema:
          type: string
          enum:
          - F
          - M
          - O
          - U
        description: |-
          * `M` - Male
          * `F` - Female
          * `O` - Other
          * `U` - Unknown
      - in: query
        name: is_published
        schema:
          type: boolean
      - in: query
        name: medical_status
        schema:
          type: string
          enum:
          - critical
          - deceased
          - health_concerns
          - healthy
          - unknown
        description: |-
          * `unknown` - Unknown
          * `healthy` - Healthy
          * `health_concerns` - Health Concerns
          * `critical` - Critical
          * `deceased` - Deceased
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: quality
        schema:
          type: integer
      - in: query
        name: quality_tier
        schema:
          type: integer
          nullable: true
          enum:
          - 1
          - 2
          - 3
        description: |-
          * `1` - Tier 1 — Strong evidence
          * `2` - Tier 2 — Average evidence
          * `3` - Tier 3 — Weak evidence
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - persons
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPersonListList'
          description: ''
    post:
      operationId: persons_create
      description: |-
        Person CRUD.

        Read access (list / retrieve): anyone (anonymous included) can read
        published persons. `get_queryset` filters out unpublished rows for
        anonymous viewers.

        Write access (create / update / destroy):
            - Must be authenticated (`IsAuthenticatedOrReadOnly`).
            - Must be a Volunteer, Advocate, or staff (`IsVolunteer`).

        Delete is hard-delete (not soft) — Person has no provenance
