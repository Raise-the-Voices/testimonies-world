  /api/notifications/:
    get:
      operationId: notifications_list
      description: |-
        List, mark-read, read-all, unread-count. No write endpoint from
        the client other than 'mark read' — notifications are server-generated
        only.
      parameters:
      - in: query
        name: is_read
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - record_created
          - record_seen
          - record_updated
          - status_done
        description: |-
          * `record_created` - New casework record
          * `record_updated` - Casework record updated
          * `status_done` - Casework marked done
          * `record_seen` - A peer opened this record
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
