      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: person
        schema:
          type: number
      - in: query
        name: relationship_type
        schema:
          type: string
          enum:
          - child
          - other
          - parent
          - sibling
          - spouse
        description: |-
          * `parent` - Parent
