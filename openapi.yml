    PatchedTestimonialWriteRequest:
      type: object
      description: |-
        Create / update shape for any role (Volunteer can create drafts).

        Server-controlled fields are read-only and silently dropped on
        input (SYSTEM_RULES §5):
          - status + all `*_by` + `*_at` workflow fields: only mutated
            via the transition actions, never via direct PATCH.
          - schema_version + is_exported: server-pinned.
          - created_by / created_at / updated_at: server-pinned.
          - source_encrypted + precise_location_encrypted: never
            serialized. Caller uses `set_source` / `set_precise_location`
            accessors (exposed via dedicated action endpoints when
            permission is held).
      properties:
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        language:
          type: string
          minLength: 1
          maxLength: 10
        country:
          type: string
          maxLength: 100
        region:
          type: string
          maxLength: 255
        incident_date:
          type: string
          format: date
          nullable: true
        incident_types: {}
        summary:
          type: string
        narrative:
          type: string
        outcome:
          type: string
        source_visibility:
          $ref: '#/components/schemas/TestimonialSourceVisibilityEnum'
        public_source_label:
          type: string
          maxLength: 255
        location_visibility:
          $ref: '#/components/schemas/TestimonialLocationVisibilityEnum'
        public_location_display:
          type: string
          maxLength: 500
        family_protected:
          type: boolean
        contact_protected:
          type: boolean
        verification_level:
          oneOf:
          - $ref: '#/components/schemas/VerificationLevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        person:
          type: integer
          nullable: true
          description: Underlying Person this testimonial is built from.
        report:
          type: integer
          nullable: true
          description: Optional Report-level link (one event, one testimonial).
        tags:
          type: array
          items:
            type: integer
