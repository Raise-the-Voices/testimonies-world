        id:
          type: integer
          readOnly: true
        person_a:
          type: integer
        person_b:
          type: integer
        person_a_name:
          type: string
          readOnly: true
        person_b_name:
          type: string
          readOnly: true
        relationship_type:
          $ref: '#/components/schemas/RelationshipTypeEnum'
        notes:
          type: string
          maxLength: 255
      required:
      - id
      - person_a
      - person_a_name
      - person_b
      - person_b_name
      - relationship_type
