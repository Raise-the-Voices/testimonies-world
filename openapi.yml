  /api/persons/countries/:
    get:
      operationId: persons_countries_list
      description: List of countries with case counts. Counts are dynamic — when other
        filters are present, counts reflect the filtered subset. The `country` filter
        itself is ignored (the dropdown always shows every country regardless of which
        is selected).
      parameters:
      - in: query
        name: category
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      - in: query
        name: country
        schema:
          type: string
      - in: query
        name: current_status
        schema:
          type: string
          enum:
          - deceased
          - detained
          - disappeared
          - released
          - restricted_movement
          - rights_restricted
          - stateless
          - unknown
        description: |-
          * `detained` - Detained
          * `disappeared` - Disappeared
          * `restricted_movement` - Restricted Movement
          * `released` - Released
          * `deceased` - Deceased
          * `unknown` - Unknown
          * `stateless` - Stateless
          * `rights_restricted` - Rights Restricted
      - in: query
        name: gender
        schema:
          type: string
          enum:
          - F
          - M
          - O
          - U
        description: |-
          * `M` - Male
          * `F` - Female
          * `O` - Other
          * `U` - Unknown
      - in: query
        name: is_published
        schema:
          type: boolean
      - in: query
        name: medical_status
        schema:
          type: string
          enum:
          - critical
          - deceased
          - health_concerns
          - healthy
          - unknown
        description: |-
          * `unknown` - Unknown
          * `healthy` - Healthy
          * `health_concerns` - Health Concerns
          * `critical` - Critical
          * `deceased` - Deceased
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: quality
        schema:
          type: integer
      - in: query
        name: quality_tier
        schema:
          type: integer
          nullable: true
          enum:
          - 1
          - 2
          - 3
        description: |-
          * `1` - Tier 1 — Strong evidence
          * `2` - Tier 2 — Average evidence
          * `3` - Tier 3 — Weak evidence
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - persons
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCountryCountEntryList'
          description: ''
