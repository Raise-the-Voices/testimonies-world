components:
  schemas:
    ActionTypeEnum:
      enum:
      - outreach
      - legal_filing
      - media
      - advocacy
      - investigation
      - other
      type: string
      description: |-
        * `outreach` - Outreach
        * `legal_filing` - Legal filing
        * `media` - Media engagement
        * `advocacy` - Advocacy
        * `investigation` - Investigation
        * `other` - Other
    BlankEnum:
      enum:
      - ''
    CaseCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - id
      - name
    CaseworkRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        performed_by_name:
          type: string
          readOnly: true
        seen_by:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
          readOnly: true
        action_type:
          $ref: '#/components/schemas/ActionTypeEnum'
        description:
          type: string
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/StatusEnum'
        next_steps:
          type: string
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        performed_by:
          type: integer
          readOnly: true
          nullable: true
        persons:
          type: array
          items:
            type: integer
      required:
      - created_at
      - date
      - description
      - id
      - performed_by
      - performed_by_name
      - seen_by
      - updated_at
    CaseworkRecordRequest:
      type: object
      properties:
        action_type:
          $ref: '#/components/schemas/ActionTypeEnum'
        description:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/StatusEnum'
        next_steps:
          type: string
        notes:
          type: string
        persons:
          type: array
          items:
            type: integer
      required:
      - date
      - description
    CategoryCount:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
      required:
      - count
      - name
    Contact:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        signal:
          type: string
          maxLength: 50
        whatsapp:
          type: string
          maxLength: 50
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        persons:
          type: array
          items:
            type: integer
      required:
      - created_at
      - deleted_at
      - id
      - name
    ContactRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        signal:
          type: string
          maxLength: 50
        whatsapp:
          type: string
          maxLength: 50
        notes:
          type: string
        persons:
          type: array
          items:
            type: integer
      required:
      - name
    CountryCountEntry:
      type: object
      properties:
        country:
          type: string
        count:
          type: integer
      required:
      - count
      - country
    CurrentStatusEnum:
      enum:
      - detained
      - disappeared
      - restricted_movement
      - released
      - deceased
      - unknown
      - stateless
      - rights_restricted
      type: string
      description: |-
        * `detained` - Detained
        * `disappeared` - Disappeared
        * `restricted_movement` - Restricted Movement
        * `released` - Released
        * `deceased` - Deceased
        * `unknown` - Unknown
        * `stateless` - Stateless
        * `rights_restricted` - Rights Restricted
    FamilyRelationship:
      type: object
      description: |-
        Family-relationship CRUD payload.

        Read shape: full row plus denormalised `person_a_name` /
        `person_b_name` so the frontend can render the list without
        resolving FK IDs separately.

        Write shape: accepts `person_a` and `person_b` as FK IDs (DRF
        `PrimaryKeyRelatedField` is the default for `IntegerField`-with-FK
        in `ModelSerializer`).

        Validation (see `validate`):
            - `person_a != person_b` — no self-link.
            - One row per ordered `(person_a, person_b)` pair, regardless
              of type — the model already enforces this via
              `unique_together = ['person_a', 'person_b']` but we drop
              DRF's auto-validator (see `get_unique_together_validators`)
              so the volunteer sees a friendlier message.
            - For undirected types (`sibling`, `spouse`, `other`), the
              reverse-ordered pair is also rejected. `parent` / `child`
              allow either direction (direction carries meaning).
      properties:
        id:
          type: integer
          readOnly: true
        person_a:
          type: integer
        person_b:
          type: integer
        person_a_name:
          type: string
          readOnly: true
        person_b_name:
          type: string
          readOnly: true
        relationship_type:
          $ref: '#/components/schemas/RelationshipTypeEnum'
        notes:
          type: string
          maxLength: 255
      required:
      - id
      - person_a
      - person_a_name
      - person_b
      - person_b_name
      - relationship_type
    FamilyRelationshipRequest:
      type: object
      description: |-
        Family-relationship CRUD payload.

        Read shape: full row plus denormalised `person_a_name` /
        `person_b_name` so the frontend can render the list without
        resolving FK IDs separately.

        Write shape: accepts `person_a` and `person_b` as FK IDs (DRF
        `PrimaryKeyRelatedField` is the default for `IntegerField`-with-FK
        in `ModelSerializer`).

        Validation (see `validate`):
            - `person_a != person_b` — no self-link.
            - One row per ordered `(person_a, person_b)` pair, regardless
              of type — the model already enforces this via
              `unique_together = ['person_a', 'person_b']` but we drop
              DRF's auto-validator (see `get_unique_together_validators`)
              so the volunteer sees a friendlier message.
            - For undirected types (`sibling`, `spouse`, `other`), the
              reverse-ordered pair is also rejected. `parent` / `child`
              allow either direction (direction carries meaning).
      properties:
        person_a:
          type: integer
        person_b:
          type: integer
        relationship_type:
          $ref: '#/components/schemas/RelationshipTypeEnum'
        notes:
          type: string
          maxLength: 255
      required:
      - person_a
      - person_b
      - relationship_type
    GenderEnum:
      enum:
      - M
      - F
      - O
      - U
      type: string
      description: |-
        * `M` - Male
        * `F` - Female
        * `O` - Other
        * `U` - Unknown
    KindEnum:
      enum:
      - record_created
      - record_updated
      - status_done
      - record_seen
      type: string
      description: |-
        * `record_created` - New casework record
        * `record_updated` - Casework record updated
        * `status_done` - Casework marked done
        * `record_seen` - A peer opened this record
    MarkAllReadResponse:
